services:
  market_sync_db:
    image: mariadb:10.3.18-bionic
    ports:
      - "3306:3306"
    networks:
      - mc_shop_backend
    environment:
      MYSQL_USER: market_sync_db
      MYSQL_PASSWORD: market_sync_db
      MYSQL_DATABASE: market_sync_db
      MYSQL_ROOT_PASSWORD: market_sync_db_root
    restart: unless-stopped

  market_sync_site:
    build:
      context: ../site
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - mc_shop_backend
      - mc_shop_frontend
    environment:
      DATABASE_URL: "mysql://market_sync_db:market_sync_db@market_sync_db:3306/market_sync_db"
      STATIC_USDT_TRC20_ADDRESS: "TTNMWr219NJ8k1RKMaEv4wzrqJK3WraUcd"


networks:
  mc_shop_backend:
  mc_shop_frontend:
