# mariadb only
database:
  host: localhost
  port: 3306
  db: 'db'
  username: 'user'
  password: 'pass'
  pool:
    max: 4
    min: 1

job:
  delay-minutes: 2

anti-brightness:
  enabled: true
  light-threshold: 1
  min-interval-ms: 2000
  warning-threshold: 3
  warning-window-ms: 10000
  punishment-threshold: 4
  punishment-window-ms: 15000
  punishment-duration-seconds: 10
  decay-interval-seconds: 10
  bypass-permission: 'marketsync.antibrightness.bypass'
  warning-message: 'Всевидящее око чует запретную магию в этой тьме. Оставь ее, иначе мрак сам взыщет с нарушителя.'
  admin-alert:
    enabled: true
    permission: 'marketsync.antibrightness.alert'
    cooldown-seconds: 15
    message: '&c[AntiBrightness] &7{player} &8@ &7{world} {x} {y} {z} &8| &7свет: глаза={eye_light} ноги={feet_light} блок={block_light} &8| &7счёт={count} окно={warning_window}/{punishment_window}'