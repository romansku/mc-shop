name: Plugin Release

on:
  push:
    tags: ["plugin-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup AuthMe compile dependency
        uses: ./.github/actions/setup-authme-lib

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/plugin-v}" >> "$GITHUB_OUTPUT"

      - name: Set project version
        working-directory: ./plugin/market-sync
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false --file pom.xml
          sed -i "s/^version: .*/version: $VERSION/" src/main/resources/paper-plugin.yml

      - name: Package with Maven
        working-directory: ./plugin/market-sync
        run: mvn -B package -DskipTests --file pom.xml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/market-sync/target/market-sync-${{ steps.version.outputs.value }}.jar
          generate_release_notes: true
